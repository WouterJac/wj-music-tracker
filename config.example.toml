# Copy this file to config.local.toml and adjust. config.local.toml is gitignored.
# The music path can also come from the WJ_MUSIC_PATH environment variable, which overrides this file.

[library]
# Folder with your FLAC files. The app only reads from it.
# Required before scanning. Set it here or with the WJ_MUSIC_PATH environment variable.
# On Windows use single quotes (music_path = 'D:\Music') or double the backslashes.
music_path = ""

[data]
# Where the database and cover cache are stored. Outside the repo and the music folder.
# Leave empty to use %LOCALAPPDATA%\WJMusicTracker
directory = ""

[server]
# Bound to localhost only unless allow_remote is true. See API-AUTH.md before changing this.
host = "127.0.0.1"
port = 8000
# Phone access: set allow_remote = true and host to "0.0.0.0" (or your Tailscale address).
# Every /api request then needs the access token; run `wj-music pair` to pair a phone.
allow_remote = false
